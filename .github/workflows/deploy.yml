name: Deploy to Fly.io

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options: [all, storefront, admin]
      promote_to_production:
        description: 'Promote current staging to production'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  REGISTRY: registry.fly.io

jobs:
  # ============================================================================
  # Stage 1a: Lint (runs in parallel with test)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >-
      !inputs.promote_to_production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: --from-latest-tag

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ============================================================================
  # Stage 1b: Tests (runs in parallel with lint)
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    if: >-
      !inputs.promote_to_production
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
        env:
          SQLX_OFFLINE: true

  # ============================================================================
  # Stage 2: Version bump (after lint+test pass, skips [skip ci] commits)
  # ============================================================================
  version-bump:
    name: Version Bump
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      !inputs.promote_to_production &&
      !contains(github.event.head_commit.message || '', '[skip ci]')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'push'

      - name: Install cargo-edit
        if: github.event_name == 'push'
        run: cargo install cargo-edit --locked

      - name: Install cocogitto
        if: github.event_name == 'push'
        run: cargo install cocogitto --locked

      - name: Bump version
        id: bump
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git log $(git describe --tags --abbrev=0)..HEAD --oneline)" ]; then
            cog bump --auto
            echo "bumped=true" >> $GITHUB_OUTPUT
          fi

      - name: Push version commit and tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          TAG=$(git describe --tags --abbrev=0)
          git push origin main "$TAG"

      - name: Output version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ============================================================================
  # Stage 3: Build Docker images (after version bump, skipped if promoting)
  # ============================================================================
  build:
    name: Build ${{ matrix.app }}
    needs: [lint, test, version-bump]
    runs-on: ubuntu-latest
    if: >-
      !inputs.promote_to_production &&
      !cancelled() &&
      !failure()
    strategy:
      matrix:
        app: [storefront, admin]
        include:
          - app: storefront
            dockerfile: docker/Dockerfile.storefront
            image: nakedpineapple-storefront-staging
            cache: nakedpineapple-storefront-cache
          - app: admin
            dockerfile: docker/Dockerfile.admin
            image: nakedpineapple-admin-staging
            cache: nakedpineapple-admin-cache
    steps:
      - name: Check if should build
        id: check
        run: |
          if [[ "${{ inputs.target }}" == "all" || "${{ inputs.target }}" == "${{ matrix.app }}" || -z "${{ inputs.target }}" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: steps.check.outputs.skip != 'true'
        with:
          ref: ${{ needs.version-bump.result == 'success' && 'main' || github.sha }}

      - name: Determine version
        id: version
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          build-args: |
            IMAGE_BASE_URL=${{ vars.IMAGE_BASE_URL }}
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.cache }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.cache }}:latest,mode=max

  # ============================================================================
  # Stage 4: Deploy to staging (after builds complete)
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy storefront to staging
        if: inputs.target != 'admin'
        run: flyctl deploy --image ${{ env.REGISTRY }}/nakedpineapple-storefront-staging:${{ github.sha }} -a nakedpineapple-storefront-staging

      - name: Deploy admin to staging
        if: inputs.target != 'storefront'
        run: flyctl deploy --image ${{ env.REGISTRY }}/nakedpineapple-admin-staging:${{ github.sha }} -a nakedpineapple-admin-staging

  # ============================================================================
  # Stage 5: Promote to production (manual trigger only)
  # ============================================================================
  promote-to-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    if: ${{ inputs.promote_to_production }}
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Get current version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get staging storefront image
        id: staging-storefront
        if: inputs.target != 'admin'
        run: |
          IMAGE=$(flyctl status -a nakedpineapple-storefront-staging --json | jq -r '.Machines[0].config.image')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Promoting storefront image: $IMAGE"

      - name: Copy storefront image to production registry
        if: inputs.target != 'admin'
        run: |
          docker pull ${{ steps.staging-storefront.outputs.image }}
          PROD_TAG=${{ env.REGISTRY }}/nakedpineapple-storefront:${{ github.run_id }}
          VERSION_TAG=${{ env.REGISTRY }}/nakedpineapple-storefront:${{ steps.version.outputs.version }}
          docker tag ${{ steps.staging-storefront.outputs.image }} $PROD_TAG
          docker tag ${{ steps.staging-storefront.outputs.image }} $VERSION_TAG
          docker push $PROD_TAG
          docker push $VERSION_TAG
          echo "STOREFRONT_PROD_IMAGE=$PROD_TAG" >> $GITHUB_ENV

      - name: Get staging admin image
        id: staging-admin
        if: inputs.target != 'storefront'
        run: |
          IMAGE=$(flyctl status -a nakedpineapple-admin-staging --json | jq -r '.Machines[0].config.image')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Promoting admin image: $IMAGE"

      - name: Copy admin image to production registry
        if: inputs.target != 'storefront'
        run: |
          docker pull ${{ steps.staging-admin.outputs.image }}
          PROD_TAG=${{ env.REGISTRY }}/nakedpineapple-admin:${{ github.run_id }}
          VERSION_TAG=${{ env.REGISTRY }}/nakedpineapple-admin:${{ steps.version.outputs.version }}
          docker tag ${{ steps.staging-admin.outputs.image }} $PROD_TAG
          docker tag ${{ steps.staging-admin.outputs.image }} $VERSION_TAG
          docker push $PROD_TAG
          docker push $VERSION_TAG
          echo "ADMIN_PROD_IMAGE=$PROD_TAG" >> $GITHUB_ENV

      - name: Deploy storefront to production
        if: inputs.target != 'admin'
        run: flyctl deploy --image ${{ env.STOREFRONT_PROD_IMAGE }} -a nakedpineapple-storefront

      - name: Deploy admin to production
        if: inputs.target != 'storefront'
        run: flyctl deploy --image ${{ env.ADMIN_PROD_IMAGE }} -a nakedpineapple-admin
