name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options: [all, storefront, admin, automations]
      promote_to_production:
        description: 'Promote current staging to production'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  REGISTRY: registry.fly.io

jobs:
  # ============================================================================
  # Stage 1a: Lint (runs in parallel with test)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: >-
      !inputs.promote_to_production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: --from-latest-tag

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  # ============================================================================
  # Stage 1b: Tests (runs in parallel with lint)
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    if: >-
      !inputs.promote_to_production
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
        env:
          SQLX_OFFLINE: true

  # ============================================================================
  # Stage 2: Version bump (after lint+test pass, skips [skip ci] commits)
  # ============================================================================
  version-bump:
    name: Version Bump
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      !inputs.promote_to_production &&
      !contains(github.event.head_commit.message || '', '[skip ci]')
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'push'

      - name: Install cargo-edit
        if: github.event_name == 'push'
        run: cargo install cargo-edit --locked

      - name: Install cocogitto
        if: github.event_name == 'push'
        run: cargo install cocogitto --locked

      - name: Bump version
        id: bump
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git log $(git describe --tags --abbrev=0)..HEAD --oneline)" ]; then
            cog bump --auto
            echo "bumped=true" >> $GITHUB_OUTPUT
          fi

      - name: Push version commit and tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          TAG=$(git describe --tags --abbrev=0)
          git push origin main "$TAG"

      - name: Output version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # ============================================================================
  # Stage 3: Build + deploy each app independently (runs in parallel)
  #
  # Each app builds its Docker image and deploys to staging in a single job.
  # If one app's build fails, the others continue unaffected.
  # ============================================================================
  storefront:
    name: Storefront
    needs: [lint, test, version-bump]
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      !inputs.promote_to_production &&
      !cancelled() && !failure() &&
      (inputs.target == 'all' || inputs.target == 'storefront' || inputs.target == '')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-bump.result == 'success' && 'main' || github.sha }}

      - name: Determine version
        id: version
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.storefront
          push: true
          tags: |
            ${{ env.REGISTRY }}/nakedpineapple-storefront-staging:${{ github.sha }}
            ${{ env.REGISTRY }}/nakedpineapple-storefront-staging:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/nakedpineapple-storefront-staging:latest
          build-args: |
            IMAGE_BASE_URL=${{ vars.IMAGE_BASE_URL }}
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/nakedpineapple-storefront-cache:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/nakedpineapple-storefront-cache:latest,mode=max

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        run: flyctl deploy --config fly/fly.storefront.staging.toml --image ${{ env.REGISTRY }}/nakedpineapple-storefront-staging:${{ github.sha }} -a nakedpineapple-storefront-staging

  admin:
    name: Admin
    needs: [lint, test, version-bump]
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      !inputs.promote_to_production &&
      !cancelled() && !failure() &&
      (inputs.target == 'all' || inputs.target == 'admin' || inputs.target == '')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-bump.result == 'success' && 'main' || github.sha }}

      - name: Determine version
        id: version
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/nakedpineapple-admin-staging:${{ github.sha }}
            ${{ env.REGISTRY }}/nakedpineapple-admin-staging:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/nakedpineapple-admin-staging:latest
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/nakedpineapple-admin-cache:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/nakedpineapple-admin-cache:latest,mode=max

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        run: flyctl deploy --config fly/fly.admin.staging.toml --image ${{ env.REGISTRY }}/nakedpineapple-admin-staging:${{ github.sha }} -a nakedpineapple-admin-staging

  automations:
    name: Automations
    needs: [lint, test, version-bump]
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      !inputs.promote_to_production &&
      !cancelled() && !failure() &&
      (inputs.target == 'all' || inputs.target == 'automations' || inputs.target == '')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-bump.result == 'success' && 'main' || github.sha }}

      - name: Determine version
        id: version
        run: |
          VERSION="${{ needs.version-bump.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 'version = "' Cargo.toml | sed 's/.*version = "\(.*\)"/\1/')
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.automations
          push: true
          tags: |
            ${{ env.REGISTRY }}/nakedpineapple-automations-staging:${{ github.sha }}
            ${{ env.REGISTRY }}/nakedpineapple-automations-staging:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/nakedpineapple-automations-staging:latest
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/nakedpineapple-automations-cache:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/nakedpineapple-automations-cache:latest,mode=max

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        run: flyctl deploy --config fly/fly.automations.staging.toml --image ${{ env.REGISTRY }}/nakedpineapple-automations-staging:${{ github.sha }} -a nakedpineapple-automations-staging

  # ============================================================================
  # Promote to production (manual trigger only, per-app)
  #
  # Each app promotes independently so one failure doesn't block the others.
  # ============================================================================
  promote-storefront:
    name: Promote Storefront
    runs-on: ubuntu-latest
    if: >-
      inputs.promote_to_production &&
      (inputs.target == 'all' || inputs.target == 'storefront')
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Get current version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get staging image
        id: staging
        run: |
          IMAGE=$(flyctl status -a nakedpineapple-storefront-staging --json | jq -r '.Machines[0].config.image')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Promoting storefront image: $IMAGE"

      - name: Copy image to production registry
        run: |
          docker pull ${{ steps.staging.outputs.image }}
          VERSION_TAG=${{ env.REGISTRY }}/nakedpineapple-storefront:${{ steps.version.outputs.version }}
          LATEST_TAG=${{ env.REGISTRY }}/nakedpineapple-storefront:latest
          docker tag ${{ steps.staging.outputs.image }} $VERSION_TAG
          docker tag ${{ steps.staging.outputs.image }} $LATEST_TAG
          docker push $VERSION_TAG
          docker push $LATEST_TAG
          echo "PROD_IMAGE=$VERSION_TAG" >> $GITHUB_ENV

      - name: Deploy to production
        run: flyctl deploy --config fly/fly.storefront.toml --image ${{ env.PROD_IMAGE }} -a nakedpineapple-storefront

  promote-admin:
    name: Promote Admin
    runs-on: ubuntu-latest
    if: >-
      inputs.promote_to_production &&
      (inputs.target == 'all' || inputs.target == 'admin')
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Get current version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get staging image
        id: staging
        run: |
          IMAGE=$(flyctl status -a nakedpineapple-admin-staging --json | jq -r '.Machines[0].config.image')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Promoting admin image: $IMAGE"

      - name: Copy image to production registry
        run: |
          docker pull ${{ steps.staging.outputs.image }}
          VERSION_TAG=${{ env.REGISTRY }}/nakedpineapple-admin:${{ steps.version.outputs.version }}
          LATEST_TAG=${{ env.REGISTRY }}/nakedpineapple-admin:latest
          docker tag ${{ steps.staging.outputs.image }} $VERSION_TAG
          docker tag ${{ steps.staging.outputs.image }} $LATEST_TAG
          docker push $VERSION_TAG
          docker push $LATEST_TAG
          echo "PROD_IMAGE=$VERSION_TAG" >> $GITHUB_ENV

      - name: Deploy to production
        run: flyctl deploy --config fly/fly.admin.toml --image ${{ env.PROD_IMAGE }} -a nakedpineapple-admin

  promote-automations:
    name: Promote Automations
    runs-on: ubuntu-latest
    if: >-
      inputs.promote_to_production &&
      (inputs.target == 'all' || inputs.target == 'automations')
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Log in to Fly Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Get current version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.1.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get staging image
        id: staging
        run: |
          IMAGE=$(flyctl status -a nakedpineapple-automations-staging --json | jq -r '.Machines[0].config.image')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "Promoting automations image: $IMAGE"

      - name: Copy image to production registry
        run: |
          docker pull ${{ steps.staging.outputs.image }}
          VERSION_TAG=${{ env.REGISTRY }}/nakedpineapple-automations:${{ steps.version.outputs.version }}
          LATEST_TAG=${{ env.REGISTRY }}/nakedpineapple-automations:latest
          docker tag ${{ steps.staging.outputs.image }} $VERSION_TAG
          docker tag ${{ steps.staging.outputs.image }} $LATEST_TAG
          docker push $VERSION_TAG
          docker push $LATEST_TAG
          echo "PROD_IMAGE=$VERSION_TAG" >> $GITHUB_ENV

      - name: Deploy to production
        run: flyctl deploy --config fly/fly.automations.toml --image ${{ env.PROD_IMAGE }} -a nakedpineapple-automations
