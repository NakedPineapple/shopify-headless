# https://docs.cocogitto.io/config

# Scopes aligned with crate names and domain areas used in git history.
scopes = [
    # Crate scopes
    "storefront",
    "admin",
    "core",
    "cli",
    # Domain scopes
    "cart",
    "blog",
    "images",
    "search",
    "warehouse",
    # Cross-cutting scopes
    "analytics",
    "logging",
    "monitoring",
    "security",
    "support",
    "automations",
    # Infrastructure scopes
    "deploy",
    "ci",
    "infra",
    "deps",
    "docker",
    "docs",
]

tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["main"]
# Update the workspace Cargo.toml version before the bump commit is created.
# All crates inherit via version.workspace = true, so only the root needs updating.
pre_bump_hooks = [
    "cargo set-version {{version}} --workspace",
]

# Move [skip ci] from the subject line to the commit body for a cleaner history.
# After amending, move the tag to the new commit (amend changes the hash,
# orphaning the tag cocogitto created on the pre-amend commit).
post_bump_hooks = [
    """git commit --amend -m "$(git log -1 --format=%s)" -m "[skip ci]" """,
    "git tag -fa v{{version}} -m 'v{{version}}'",
]

[commit_types]
build = { changelog_title = "Build System" }
chore = { changelog_title = "Chores" }
ci = { changelog_title = "Continuous Integration" }
docs = { changelog_title = "Documentation" }
feat = { changelog_title = "Features" }
fix = { changelog_title = "Bug Fixes" }
perf = { changelog_title = "Performance" }
refactor = { changelog_title = "Refactoring" }
revert = { changelog_title = "Reverts" }
style = { changelog_title = "Styles" }
test = { changelog_title = "Tests" }

[changelog]
path = "CHANGELOG.md"
