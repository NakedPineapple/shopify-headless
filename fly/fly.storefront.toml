app = "nakedpineapple-storefront"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../docker/Dockerfile.storefront"

[deploy]
  strategy = "bluegreen"

[env]
  STOREFRONT_HOST = "0.0.0.0"
  STOREFRONT_PORT = "8080"
  RUST_LOG = "info,naked_pineapple_storefront=debug,tower_http=info,reqwest=warn,sqlx::query=warn,rustls=warn,h2=warn,hyper_util=warn"
  STOREFRONT_BASE_URLS = "https://nakedpineapple.co,https://pineappleskinco.com"
  IMAGE_BASE_URL = "https://images.nakedpineapple.com"
  SHOPIFY_STORE = "nakedpineapple.myshopify.com"
  SHOPIFY_CUSTOMER_SHOP_ID = "71655391511"
  SHOPIFY_API_VERSION = "2026-01"
  SHOPIFY_CUSTOMER_CLIENT_ID = "d87e8c38-17a3-4ac1-981a-981ddd43d305"
  SHOPIFY_STOREFRONT_PUBLIC_TOKEN = "acbc485b80b86144aacb8d573e521e51"
  SENTRY_DSN_PUBLIC = "https://d710e51074133004e484180073cd8729@o4510830607073280.ingest.us.sentry.io/4510830616838144"
  SENTRY_ENVIRONMENT = "production"
  KLAVIYO_LIST_ID = "UHyqYT"
  GA4_MEASUREMENT_ID = "G-DSQV77J3Z9"
  GOOGLE_ADS_ID = "AW-17384191288"
  META_PIXEL_ID = "1977321279788404"
  PINTEREST_TAG_ID = "2614124776925"
  TIKTOK_PIXEL_ID = "CST5MDBC77U0O0P8B5Q0"
  CRAZY_EGG_ACCOUNT_ID = "0132/0524"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[http_service.checks]]
  grace_period = "30s"
  interval = "60s"
  method = "GET"
  path = "/health/ready"
  timeout = "10s"

[http_service.concurrency]
  type = "requests"
  soft_limit = 150
  hard_limit = 250

[metrics]
  port = 9090
  path = "/metrics"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
