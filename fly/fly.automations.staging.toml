app = "nakedpineapple-automations-staging"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../docker/Dockerfile.automations"

[env]
  RUST_LOG = "info,naked_pineapple_automations=debug,tower_http=info,sqlx::query=warn,rustls=warn,h2=warn,hyper_util=warn"
  SHOPIFY_STORE = "nakedpineapple.myshopify.com"
  SHOPIFY_API_VERSION = "2026-01"
  SMTP_HOST = "outbound.mailhop.org"
  SMTP_PORT = "587"
  SMTP_USERNAME = "Qm49khKp"
  SMTP_FROM = "noreply@pineappleskinco.com"
  KLAVIYO_LIST_ID = "UHyqYT"
  M365_TENANT_ID = "0e9438fb-e563-4b63-9252-a290bb10bc6d"
  M365_CLIENT_ID = "8eae8572-7a2e-4cbe-802d-ec16dea920e6"
  M365_SHARED_MAILBOXES = "info@pineappleskinco.com,support@pineappleskinco.com"
  AUTOMATION_EMAIL_SYNC_UNTIL = "2024-10-01T00:00:00Z"
  AUTOMATION_HEALTH_PORT = "9092"
  WEBHOOK_PORT = "8080"
  WEBHOOK_BASE_URL = "https://nakedpineapple-automations-staging.fly.dev"
  STOREFRONT_INTERNAL_URL = "http://nakedpineapple-storefront-staging.internal:9091"
  SENTRY_ENVIRONMENT = "staging"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[checks]
  [checks.health]
    port = 9092
    type = "http"
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

  [checks.readiness]
    port = 9092
    type = "http"
    method = "GET"
    path = "/health/ready"
    interval = "60s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  count = 1
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
