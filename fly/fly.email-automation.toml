app = "nakedpineapple-email-automation"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../docker/Dockerfile.email-automation"

[env]
  RUST_LOG = "warn,naked_pineapple_email_automation=info,tower_http=info,sqlx::query=warn,rustls=warn,h2=warn,hyper_util=warn"
  SHOPIFY_STORE = "nakedpineapple.myshopify.com"
  SHOPIFY_API_VERSION = "2026-01"
  SMTP_HOST = "outbound.mailhop.org"
  SMTP_USERNAME = "Qm49khKp"
  SMTP_FROM = "noreply@pineappleskinco.com"
  AUTOMATION_HEALTH_PORT = "9092"
  SENTRY_ENVIRONMENT = "production"

# No http_service — background worker, no inbound web traffic via Fly proxy

[checks]
  [checks.health]
    port = 9092
    type = "http"
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

  [checks.readiness]
    port = 9092
    type = "http"
    method = "GET"
    path = "/health/ready"
    interval = "60s"
    timeout = "10s"
    grace_period = "30s"

[[vm]]
  count = 1
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
