app = "nakedpineapple-admin-staging"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../docker/Dockerfile.admin"

[mounts]
  source = "tailscale_state"
  destination = "/var/lib/tailscale"

[env]
  ADMIN_HOST = "0.0.0.0"
  ADMIN_PORT = "443"
  RUST_LOG = "info,naked_pineapple_admin=debug,tower_http=info,reqwest=warn,sqlx::query=warn,rustls=warn,h2=warn,hyper_util=warn"
  ADMIN_HOSTS = "staging.admin.pineappleskinco.com,staging.admin.nakedpineapple.co"
  SHOPIFY_STORE = "nakedpineapple.myshopify.com"
  SHOPIFY_API_VERSION = "2026-01"
  SHOPIFY_ADMIN_CLIENT_ID = "43890b19705271a1369762cb0fea3e4b"
  SMTP_HOST = "outbound.mailhop.org"
  SMTP_USERNAME = "Qm49khKp"
  SMTP_FROM = "noreply@pineappleskinco.com"
  KLAVIYO_LIST_ID="UHyqYT"
  R2_ACCOUNT_ID = "f2f9531d0bc1561d8f72ce73476e47fc"
  R2_ACCESS_KEY_ID = "e26cf6adbd2435dbfecd0b6298a10192"
  R2_BUCKET_DOCUMENTS = "nakedpineapple-documents"
  R2_BUCKET_ORIGINAL_IMAGES = "nakedpineapple-original-images"
  ADMIN_HEALTH_PORT = "9091"
  TAILSCALE_TAGS = "tag:server"
  TAILSCALE_CLIENT_ID = "kTwQk5gSr311CNTRL"

# No http_service - traffic comes via Tailscale, not Fly proxy

[checks]
  [checks.health]
    port = 9091
    type = "http"
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

  [checks.readiness]
    port = 9091
    type = "http"
    method = "GET"
    path = "/health/ready"
    interval = "60s"
    timeout = "10s"
    grace_period = "30s"

[metrics]
  port = 9090
  path = "/metrics"

[[vm]]
  count = 1
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
