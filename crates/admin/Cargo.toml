[package]
name = "naked-pineapple-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Internal admin binary for Pineapple Skin Co. (port 3001, Tailscale-only)"
readme = "README.md"
keywords = ["ecommerce", "admin", "shopify", "axum"]
categories = ["web-programming::http-server"]
publish = false

[[bin]]
name = "naked-pineapple-admin"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
naked-pineapple-automations = { workspace = true }
naked-pineapple-core = { workspace = true, features = ["postgres"] }
naked-pineapple-crypto = { workspace = true }
naked-pineapple-services = { workspace = true }
naked-pineapple-support = { workspace = true }

# Web framework
axum = { workspace = true }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database
sqlx = { workspace = true }

# Templating
askama = { workspace = true }
askama_web = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

# GraphQL client
graphql_client = { workspace = true }
reqwest = { workspace = true }

# Auth
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5"
tower-sessions = { workspace = true }
tower-sessions-sqlx-store = { workspace = true }

# Metrics
axum-prometheus = { workspace = true }

# Error tracking
sentry = { workspace = true }
sentry-tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
dotenvy = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
time = "0.3"
bytes = "1"
rand = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }

# Security
secrecy = { workspace = true }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"

# Object storage (Cloudflare R2)
aws-config = "1.8"
aws-sdk-s3 = "1.131"

# HTML sanitization (email body rendering)
ammonia = { workspace = true }

# Document processing
pdf-extract = "0.10"

# Image processing (gallery thumbnails)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Caching
moka = { workspace = true }

# Streaming
async-stream = "0.3"
futures = { workspace = true }

# JSON Schema validation
jsonschema = { workspace = true }
