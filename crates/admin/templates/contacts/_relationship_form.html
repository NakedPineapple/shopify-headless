<div class="flex flex-col h-full">
    <!-- Header -->
    <div class="flex items-center gap-3 px-4 py-3 border-b border-border">
        <i class="ph ph-link text-lg text-coral"></i>
        <h3 class="text-base font-medium text-foreground">New Relationship</h3>
    </div>

    <!-- Form -->
    <form class="flex-1 flex flex-col"
          hx-post="/contacts/relationships/new"
          hx-target="#contact-detail-panel"
          hx-swap="innerHTML">
        <div class="p-4 space-y-4 flex-1">
            <!-- From Contact -->
            <div>
                <label class="text-xs font-medium text-muted-foreground uppercase tracking-wider" for="rel-from">From</label>
                <select id="rel-from" name="from_contact_id" class="input input-sm mt-1 w-full" required>
                    <option value="" disabled selected>Select a contact...</option>
                    {% for c in contacts %}
                    <option value="{{ c.id }}">{{ c.name }} ({{ c.contact_type }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Relationship Type -->
            <div>
                <label class="text-xs font-medium text-muted-foreground uppercase tracking-wider" for="rel-new-type">Type</label>
                <select id="rel-new-type" name="relationship_type" class="input input-sm mt-1 w-full" required>
                    {% for rt in relationship_types %}
                    <option value="{{ rt }}">{{ rt }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- To Contact -->
            <div>
                <label class="text-xs font-medium text-muted-foreground uppercase tracking-wider" for="rel-to">To</label>
                <select id="rel-to" name="to_contact_id" class="input input-sm mt-1 w-full" required>
                    <option value="" disabled selected>Select a contact...</option>
                    {% for c in contacts %}
                    <option value="{{ c.id }}">{{ c.name }} ({{ c.contact_type }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 px-4 py-3 border-t border-border">
            <button type="submit" class="btn btn-sm btn-primary flex-1">
                <i class="ph ph-plus mr-1"></i> Create Relationship
            </button>
        </div>
    </form>
</div>
