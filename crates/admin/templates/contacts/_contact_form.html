<div class="flex flex-col h-full">
    <!-- Header -->
    <div class="flex items-center gap-3 px-4 py-3 border-b border-border">
        <i class="ph ph-plus-circle text-lg text-coral"></i>
        <h3 class="text-base font-medium text-foreground">New Contact</h3>
    </div>

    <!-- Form -->
    <form class="flex-1 flex flex-col"
          hx-post="/contacts/new"
          hx-target="#contact-detail-panel"
          hx-swap="innerHTML">
        <div class="p-4 space-y-4 flex-1">
            <!-- Type -->
            <div>
                <label class="text-xs font-medium text-muted-foreground uppercase tracking-wider">Type</label>
                <div class="flex gap-3 mt-1.5">
                    <label class="flex items-center gap-2 text-sm text-foreground cursor-pointer">
                        <input type="radio" name="contact_type" value="person" checked class="accent-coral">
                        Person
                    </label>
                    <label class="flex items-center gap-2 text-sm text-foreground cursor-pointer">
                        <input type="radio" name="contact_type" value="organization" class="accent-coral">
                        Organization
                    </label>
                </div>
            </div>

            <!-- Name -->
            <div>
                <label class="text-xs font-medium text-muted-foreground uppercase tracking-wider" for="new-name">Name</label>
                <input type="text" id="new-name" name="name"
                       class="input input-sm mt-1 w-full" required
                       placeholder="Full name or company name">
            </div>

            <!-- Email -->
            <div>
                <label class="text-xs font-medium text-muted-foreground uppercase tracking-wider" for="new-email">Email</label>
                <input type="email" id="new-email" name="email"
                       class="input input-sm mt-1 w-full"
                       placeholder="Optional">
            </div>

            <!-- Domain -->
            <div>
                <label class="text-xs font-medium text-muted-foreground uppercase tracking-wider" for="new-domain">Domain</label>
                <input type="text" id="new-domain" name="domain"
                       class="input input-sm mt-1 w-full"
                       placeholder="Optional (e.g. example.com)">
            </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-2 px-4 py-3 border-t border-border">
            <button type="submit" class="btn btn-sm btn-primary flex-1">
                <i class="ph ph-plus mr-1"></i> Create Contact
            </button>
        </div>
    </form>
</div>
