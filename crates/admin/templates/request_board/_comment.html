{# Comment partial. Receives `comment` variable (CommentView). #}
<div class="flex gap-3 py-4">
    {# Avatar placeholder #}
    <div class="w-8 h-8 rounded-full bg-muted flex items-center justify-center shrink-0">
        <i class="ph ph-user text-sm text-muted-foreground"></i>
    </div>

    <div class="flex-1 min-w-0">
        {# Author and timestamp #}
        <div class="flex items-center gap-2 mb-1">
            <span class="text-sm font-medium text-foreground">{{ comment.author_name }}</span>
            <span class="text-xs text-muted-foreground">{{ comment.created_at }}</span>
        </div>

        {# Comment body rendered as markdown #}
        <div class="markdown-content text-sm text-foreground"
             data-raw-content="{{ comment.body }}">
            {{ comment.body }}
        </div>
    </div>
</div>
