<div class="gallery-card group relative bg-card rounded-xl border border-border overflow-hidden hover:border-coral/30 transition-colors"
     data-key="{{ img.key }}">
    <!-- Checkbox -->
    <label class="absolute top-2 left-2 z-10 cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity">
        <input type="checkbox" class="gallery-checkbox w-4 h-4 rounded border-border bg-input text-coral focus:ring-coral" data-key="{{ img.key }}">
    </label>

    <!-- Thumbnail -->
    <div class="aspect-square cursor-pointer" onclick="galleryOpenLightbox('{{ img.key }}')">
        <img src="{{ img.thumb_url }}"
             alt="{{ img.filename }}"
             loading="lazy"
             class="w-full h-full object-cover">
    </div>

    <!-- Info overlay -->
    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3 opacity-0 group-hover:opacity-100 transition-opacity">
        <p class="text-xs text-white font-medium truncate">{{ img.filename }}</p>
        <p class="text-xs text-white/70">{{ img.file_size_display }}</p>
    </div>

    <!-- Quick actions -->
    <div class="absolute top-2 right-2 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        {% if img.has_metadata %}
        <span class="w-2 h-2 bg-emerald-400 rounded-full" title="Has metadata"></span>
        {% endif %}
        <button type="button"
                onclick="event.stopPropagation(); galleryOpenLightbox('{{ img.key }}')"
                class="p-1.5 bg-black/50 text-white rounded-lg hover:bg-black/70 transition-colors"
                title="Preview">
            <i class="ph ph-eye text-sm"></i>
        </button>
        <button type="button"
                onclick="event.stopPropagation(); galleryDeleteSingle('{{ img.key }}')"
                class="p-1.5 bg-black/50 text-white rounded-lg hover:bg-red-600/70 transition-colors"
                title="Delete">
            <i class="ph ph-trash text-sm"></i>
        </button>
    </div>
</div>
