{% extends "layouts/base.html" %}

{% block title %}Edit Expense{% endblock %}

{% block page_title %}
<div class="flex items-center gap-3">
    <a href="/financials/expenses" class="text-muted-foreground hover:text-foreground transition-colors">
        <i class="ph ph-arrow-left text-xl"></i>
    </a>
    <div>
        <h1 class="text-2xl font-semibold text-foreground">Edit Expense</h1>
        <p class="text-sm text-muted-foreground mt-1">{{ expense.description }}</p>
    </div>
</div>
{% endblock %}

{% block content %}
<form action="/financials/expenses/{{ expense.id }}" method="POST" class="max-w-2xl">
    <div class="bg-card rounded-xl border border-border p-6 space-y-6">
        <!-- Category -->
        <div>
            <label for="category_id" class="block text-sm font-medium text-foreground mb-1.5">Category</label>
            <select id="category_id" name="category_id" required
                    class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if cat.id == expense_raw.expense.category_id %}selected{% endif %}>{{ cat.name }} ({{ cat.expense_type }})</option>
                {% endfor %}
            </select>
        </div>

        <!-- Description + Amount -->
        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label for="description" class="block text-sm font-medium text-foreground mb-1.5">Description</label>
                <input type="text" id="description" name="description" required
                       value="{{ expense_raw.expense.description }}"
                       class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
            </div>
            <div>
                <label for="amount" class="block text-sm font-medium text-foreground mb-1.5">Amount</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">$</span>
                    <input type="number" id="amount" name="amount" required step="0.01" min="0"
                           value="{{ expense_raw.expense.amount }}"
                           class="w-full pl-7 pr-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
                </div>
            </div>
        </div>

        <!-- Date + Vendor -->
        <div class="grid gap-4 sm:grid-cols-2">
            <div>
                <label for="expense_date" class="block text-sm font-medium text-foreground mb-1.5">Date</label>
                <input type="date" id="expense_date" name="expense_date" required
                       value="{{ expense_raw.expense.date }}"
                       class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
            </div>
            <div>
                <label for="vendor" class="block text-sm font-medium text-foreground mb-1.5">Vendor</label>
                <input type="text" id="vendor" name="vendor"
                       value="{{ expense_raw.expense.vendor.as_deref().unwrap_or("") }}"
                       class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
            </div>
        </div>

        <!-- Channel -->
        <div>
            <label for="channel_name" class="block text-sm font-medium text-foreground mb-1.5">
                Channel <span class="text-muted-foreground font-normal">(for ad spend attribution)</span>
            </label>
            <input type="text" id="channel_name" name="channel_name"
                   value="{{ expense_raw.expense.channel_name.as_deref().unwrap_or("") }}"
                   class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
        </div>

        <!-- Recurring Toggle -->
        <div>
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" name="is_recurring" id="is_recurring"
                       {% if expense_raw.expense.is_recurring %}checked{% endif %}
                       class="w-4 h-4 rounded border-border text-coral focus:ring-ring"
                       onchange="document.getElementById('recurring-fields').classList.toggle('hidden', !this.checked)">
                <span class="text-sm font-medium text-foreground">This is a recurring expense</span>
            </label>
        </div>

        <!-- Recurring Fields -->
        <div id="recurring-fields" class="{% if !expense_raw.expense.is_recurring %}hidden{% endif %} grid gap-4 sm:grid-cols-2 pl-7">
            <div>
                <label for="recurrence_interval" class="block text-sm font-medium text-foreground mb-1.5">Interval</label>
                <select id="recurrence_interval" name="recurrence_interval"
                        class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
                    <option value="monthly" {% if expense_raw.expense.recurrence_interval == Some(crate::models::expense::RecurrenceInterval::Monthly) %}selected{% endif %}>Monthly</option>
                    <option value="quarterly" {% if expense_raw.expense.recurrence_interval == Some(crate::models::expense::RecurrenceInterval::Quarterly) %}selected{% endif %}>Quarterly</option>
                    <option value="yearly" {% if expense_raw.expense.recurrence_interval == Some(crate::models::expense::RecurrenceInterval::Yearly) %}selected{% endif %}>Yearly</option>
                </select>
            </div>
            <div>
                <label for="recurrence_end_date" class="block text-sm font-medium text-foreground mb-1.5">
                    End Date <span class="text-muted-foreground font-normal">(optional)</span>
                </label>
                <input type="date" id="recurrence_end_date" name="recurrence_end_date"
                       value="{% if let Some(d) = expense_raw.expense.recurrence_end_date %}{{ d }}{% endif %}"
                       class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors">
            </div>
        </div>

        <!-- Notes -->
        <div>
            <label for="notes" class="block text-sm font-medium text-foreground mb-1.5">Notes</label>
            <textarea id="notes" name="notes" rows="3"
                      class="w-full px-3 py-2 bg-input border border-border rounded-lg text-foreground focus:ring-2 focus:ring-ring focus:border-ring transition-colors resize-y">{{ expense_raw.expense.notes.as_deref().unwrap_or("") }}</textarea>
        </div>
    </div>

    <!-- Actions -->
    <div class="mt-6 flex items-center justify-end gap-3">
        <a href="/financials/expenses" class="px-4 py-2 text-sm text-muted-foreground hover:text-foreground transition-colors">Cancel</a>
        <button type="submit" class="px-4 py-2 bg-coral text-white rounded-lg hover:bg-coral/90 transition-colors">
            Save Changes
        </button>
    </div>
</form>
{% endblock %}
