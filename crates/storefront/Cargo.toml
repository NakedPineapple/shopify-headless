[package]
name = "naked-pineapple-storefront"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Public storefront binary for Pineapple Skin Co. (port 3000)"
readme = "README.md"
keywords = ["ecommerce", "storefront", "shopify", "axum"]
categories = ["web-programming::http-server"]
publish = false

[[bin]]
name = "naked-pineapple-storefront"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
naked-pineapple-core = { workspace = true, features = ["postgres"] }
naked-pineapple-services = { workspace = true }
naked-pineapple-support = { workspace = true, features = ["sqlx-macros"] }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database
sqlx = { workspace = true }

# Templating
askama = { workspace = true }
askama_web = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# GraphQL client
graphql_client = { workspace = true }
reqwest = { workspace = true }

# Sessions
tower-sessions = { workspace = true }
tower-sessions-sqlx-store = { workspace = true }

# Metrics
axum-prometheus = { workspace = true }

# Error tracking
sentry = { workspace = true }
sentry-tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
dotenvy = { workspace = true }
url = { workspace = true }
rust_decimal = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

# Markdown & Content
# NOTE: syntect feature disabled to avoid unmaintained bincode/yaml-rust deps
# Re-enable when syntect updates dependencies or use alternative highlighting
comrak = { version = "0.50", default-features = false }
gray_matter = "0.3"

# Caching
moka = { version = "0.12", features = ["future"] }

# Rate limiting
governor = "0.10"
tower_governor = "0.8"

# Security
secrecy = { workspace = true }
ammonia = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }

# Async utilities
futures = { workspace = true }
async-stream = "0.3"

# URL encoding
urlencoding = { workspace = true }

# Search
tantivy = "0.25"
regex = "1.12"

# JSON Schema validation
jsonschema = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }
