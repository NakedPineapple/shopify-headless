{# Blog newsletter success fragment - styled to match the gradient section #}
<div id="blog-newsletter-card" class="max-w-2xl mx-auto text-center">
    <div class="space-y-4">
        {# Success icon #}
        <div class="w-16 h-16 mx-auto bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center">
            <i class="ph-fill ph-check-circle text-3xl text-white"></i>
        </div>

        <h2 class="font-display text-3xl md:text-4xl text-white">
            You're In!
        </h2>

        <p class="text-white/90 text-lg">
            Welcome to the glow crew! We've sent a confirmation to
            <span class="font-semibold text-white">{{ email }}</span>.
        </p>

        <p class="text-white/70">
            Get ready for exclusive offers, skincare tips, and first access to new products.
        </p>
    </div>
</div>
<script>
if (window.mixpanel) {
    mixpanel.track('Newsletter Subscribed');
}
</script>
