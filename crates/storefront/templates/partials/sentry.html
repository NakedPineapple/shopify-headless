{# Sentry Browser SDK for frontend error tracking #}
{# Reads DSN and environment from Askama filter functions (env vars) #}
{% let sentry_dsn = ""|sentry_dsn_public %}
{% let sentry_env = ""|sentry_environment %}
{% if !sentry_dsn.is_empty() %}
<script src="/static/vendor/sentry.bundle.tracing.min.js"></script>
<script nonce="{{ nonce }}">
(function() {
    'use strict';

    var dsn = '{{ sentry_dsn }}';
    var environment = '{{ sentry_env }}';

    if (!dsn) return;

    Sentry.init({
        dsn: dsn,
        environment: environment,
        integrations: [
            Sentry.browserTracingIntegration()
        ],
        tracesSampleRate: 1.0,
        // Use the page origin so trace headers are attached to same-origin
        // requests (HTMX, fetch) on all storefront domains, not just
        // *.nakedpineapple.com.
        tracePropagationTargets: ['localhost', location.origin],
        beforeSend: function(event) {
            // Filter out known non-errors
            if (event.exception && event.exception.values) {
                var firstException = event.exception.values[0];
                if (firstException && firstException.value) {
                    // Skip ResizeObserver loop errors (benign browser quirk)
                    if (firstException.value.indexOf('ResizeObserver loop') !== -1) {
                        return null;
                    }
                }
            }

            // TODO(post-launch): Once analytics integrations are validated,
            // add denyUrls to drop unhandled errors from third-party analytics
            // SDKs (e.g. Pinterest fetch failures when blocked by ad blockers).
            // See: https://docs.sentry.io/platforms/javascript/configuration/filtering/
            // Example:
            //   denyUrls: [
            //       /s\.pinimg\.com/,
            //       /connect\.facebook\.net/,
            //       /analytics\.tiktok\.com/,
            //       /sc-static\.net/,
            //       /bat\.bing\.com/,
            //       /static\.ads-twitter\.com/,
            //   ]
            // (denyUrls is a top-level Sentry.init option, not inside beforeSend)

            return event;
        }
    });

    // Capture HTMX-specific errors (deferred until body exists)
    function attachHtmxErrorHandlers() {
        document.body.addEventListener('htmx:sendError', function(evt) {
            Sentry.captureException(new Error('HTMX send error: ' + evt.detail.error), {
                extra: {
                    xhr: evt.detail.xhr,
                    path: evt.detail.pathInfo ? evt.detail.pathInfo.requestPath : 'unknown'
                }
            });
        });

        document.body.addEventListener('htmx:responseError', function(evt) {
            // Only capture 5xx errors (4xx are expected user errors)
            var status = evt.detail.xhr ? evt.detail.xhr.status : 0;
            if (status >= 500) {
                Sentry.captureException(new Error('HTMX response error: ' + status), {
                    extra: {
                        status: status,
                        path: evt.detail.pathInfo ? evt.detail.pathInfo.requestPath : 'unknown',
                        response: evt.detail.xhr ? evt.detail.xhr.responseText.substring(0, 500) : ''
                    }
                });
            }
        });
    }

    // Attach handlers when body is ready
    if (document.body) {
        attachHtmxErrorHandlers();
    } else {
        document.addEventListener('DOMContentLoaded', attachHtmxErrorHandlers);
    }

    // Capture failed image/resource loads from R2 and Shopify CDN
    window.addEventListener('error', function(evt) {
        // Only capture resource load failures (not JS errors)
        if (!evt.target || evt.target === window) return;

        var element = evt.target;
        var tagName = element.tagName ? element.tagName.toLowerCase() : '';

        // Only track img, link (CSS), and script elements
        if (tagName !== 'img' && tagName !== 'link' && tagName !== 'script') return;

        var src = element.src || element.href || '';
        if (!src) return;

        // Only track failures from our CDN sources
        var isR2 = src.indexOf('images.nakedpineapple.com') !== -1;
        var isShopify = src.indexOf('cdn.shopify.com') !== -1;

        if (!isR2 && !isShopify) return;

        var origin = isR2 ? 'R2' : 'Shopify CDN';
        var resourceType = tagName === 'img' ? 'image' : (tagName === 'link' ? 'stylesheet' : 'script');

        Sentry.captureMessage('Resource load failed: ' + resourceType + ' from ' + origin, {
            level: 'warning',
            extra: {
                url: src,
                origin: origin,
                resourceType: resourceType,
                elementTag: tagName,
                pageUrl: window.location.href
            }
        });
    }, true); // Use capture phase to catch before bubbling
})();
</script>
{% endif %}
