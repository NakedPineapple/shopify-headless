fragment MoneyFields on MoneyV2 {
  amount
  currencyCode
}

fragment SubscriptionLineFields on SubscriptionLine {
  id
  name
  quantity
  currentPrice {
    ...MoneyFields
  }
  image {
    url
    altText
  }
}

fragment SubscriptionFields on SubscriptionContract {
  id
  status
  createdAt
  nextBillingDate
  billingPolicy {
    interval
    intervalCount {
      count
    }
  }
  deliveryPrice {
    ...MoneyFields
  }
  lines(first: 10) {
    edges {
      node {
        ...SubscriptionLineFields
      }
    }
  }
}

query GetSubscriptions($first: Int!) {
  customer {
    subscriptionContracts(first: $first, sortKey: CREATED_AT, reverse: true) {
      edges {
        node {
          ...SubscriptionFields
        }
      }
    }
  }
}

query GetSubscription($id: ID!) {
  customer {
    subscriptionContract(id: $id) {
      ...SubscriptionFields
    }
  }
}

mutation PauseSubscription($id: ID!) {
  subscriptionContractPause(subscriptionContractId: $id) {
    contract {
      id
      status
    }
    userErrors {
      field
      message
      code
    }
  }
}

mutation CancelSubscription($id: ID!) {
  subscriptionContractCancel(subscriptionContractId: $id) {
    contract {
      id
      status
    }
    userErrors {
      field
      message
      code
    }
  }
}

mutation ActivateSubscription($id: ID!) {
  subscriptionContractActivate(subscriptionContractId: $id) {
    contract {
      id
      status
    }
    userErrors {
      field
      message
      code
    }
  }
}

query GetUpcomingBillingCycles($id: ID!, $first: Int!) {
  customer {
    subscriptionContract(id: $id) {
      upcomingBillingCycles(first: $first) {
        edges {
          node {
            billingAttemptExpectedDate
            cycleIndex
            skipped
            status
          }
        }
      }
    }
  }
}

mutation SkipBillingCycle($input: SubscriptionBillingCycleInput!) {
  subscriptionBillingCycleSkip(billingCycleInput: $input) {
    billingCycle {
      cycleIndex
      skipped
    }
    userErrors {
      field
      message
      code
    }
  }
}

mutation UnskipBillingCycle($input: SubscriptionBillingCycleInput!) {
  subscriptionBillingCycleUnskip(billingCycleInput: $input) {
    billingCycle {
      cycleIndex
      skipped
    }
    userErrors {
      field
      message
      code
    }
  }
}
