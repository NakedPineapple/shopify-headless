fragment AddressFields on CustomerAddress {
  id
  firstName
  lastName
  company
  address1
  address2
  city
  province
  zoneCode
  country
  territoryCode
  zip
  phoneNumber
}

mutation CustomerAddressCreate($address: CustomerAddressInput!) {
  customerAddressCreate(address: $address) {
    customerAddress {
      ...AddressFields
    }
    userErrors {
      field
      message
      code
    }
  }
}
