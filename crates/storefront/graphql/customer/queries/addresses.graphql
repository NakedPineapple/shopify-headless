fragment AddressFields on CustomerAddress {
  id
  firstName
  lastName
  company
  address1
  address2
  city
  province
  zoneCode
  country
  territoryCode
  zip
  phoneNumber
}

query GetAddresses($first: Int!) {
  customer {
    addresses(first: $first) {
      edges {
        node {
          ...AddressFields
        }
      }
    }
  }
}

mutation CustomerAddressCreate($address: CustomerAddressInput!) {
  customerAddressCreate(address: $address) {
    customerAddress {
      ...AddressFields
    }
    userErrors {
      field
      message
      code
    }
  }
}

mutation CustomerAddressUpdate($addressId: ID!, $address: CustomerAddressInput!) {
  customerAddressUpdate(addressId: $addressId, address: $address) {
    customerAddress {
      ...AddressFields
    }
    userErrors {
      field
      message
      code
    }
  }
}

mutation CustomerAddressDelete($addressId: ID!) {
  customerAddressDelete(addressId: $addressId) {
    deletedAddressId
    userErrors {
      field
      message
      code
    }
  }
}
