fragment AddressFields on CustomerAddress {
  id
  firstName
  lastName
  company
  address1
  address2
  city
  province
  zoneCode
  country
  territoryCode
  zip
  phoneNumber
}

query GetCustomer {
  customer {
    id
    emailAddress {
      emailAddress
      marketingState
    }
    firstName
    lastName
    phoneNumber {
      phoneNumber
    }
    defaultAddress {
      ...AddressFields
    }
  }
}
