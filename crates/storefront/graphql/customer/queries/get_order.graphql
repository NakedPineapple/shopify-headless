fragment MoneyFields on MoneyV2 {
  amount
  currencyCode
}

query GetOrder($id: ID!) {
  order(id: $id) {
    id
    name
    number
    processedAt
    financialStatus
    fulfillmentStatus
    totalPrice {
      ...MoneyFields
    }
    subtotal {
      ...MoneyFields
    }
    totalShipping {
      ...MoneyFields
    }
    totalTax {
      ...MoneyFields
    }
    lineItems(first: 50) {
      edges {
        node {
          id
          title
          quantity
          unitPrice {
            price {
              ...MoneyFields
            }
          }
          totalPrice {
            ...MoneyFields
          }
          image {
            url
            altText
          }
          variantTitle
        }
      }
    }
    shippingAddress {
      id
      firstName
      lastName
      company
      address1
      address2
      city
      province
      zoneCode
      country
      territoryCode
      zip
      phoneNumber
    }
    returns(first: 10) {
      edges {
        node {
          id
          name
          status
        }
      }
    }
  }
}
