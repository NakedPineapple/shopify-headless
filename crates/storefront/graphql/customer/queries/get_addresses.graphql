fragment AddressFields on CustomerAddress {
  id
  firstName
  lastName
  company
  address1
  address2
  city
  province
  zoneCode
  country
  territoryCode
  zip
  phoneNumber
}

query GetAddresses($first: Int!) {
  customer {
    addresses(first: $first) {
      edges {
        node {
          ...AddressFields
        }
      }
    }
  }
}
