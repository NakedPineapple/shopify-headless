[package]
name = "naked-pineapple-email-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Email automation service for Naked Pineapple (inbound triage, outbound workflows)"
publish = false

[[bin]]
name = "naked-pineapple-email-automation"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
naked-pineapple-services = { workspace = true }

# Web framework (health check endpoint only)
axum = { workspace = true }
tokio = { workspace = true }

# Database
# The "time" feature is required here but not in admin/storefront because
# `cargo sqlx prepare` compiles each crate in isolation. The admin crate gets
# sqlx's "time" feature transitively via `tower-sessions-sqlx-store`, and when
# building the full workspace Cargo unifies features so every crate benefits.
# But `cargo sqlx prepare` runs from this crate's directory, so sqlx only sees
# features declared here. Without "time", the offline macro expansion resolves
# TIMESTAMPTZ to `time::OffsetDateTime` (from the cached .sqlx/ metadata
# generated during a workspace build) but the `Encode<Postgres>` impl for
# `OffsetDateTime` is gated behind the "time" feature, causing compilation to
# fail. Adding it explicitly ensures `sqlx prepare` succeeds in isolation.
sqlx = { workspace = true, features = ["time"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client (Microsoft Graph API)
reqwest = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Error tracking
sentry = { workspace = true }
sentry-tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
dotenvy = { workspace = true }
chrono = { workspace = true }
time = "0.3"
rust_decimal = { workspace = true }

# Security
secrecy = { workspace = true }

# Utilities (Slack webhook URL encoding)
urlencoding = { workspace = true }
uuid = { workspace = true }
