[package]
name = "naked-pineapple-email-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Email automation service for Naked Pineapple (inbound triage, outbound workflows)"
publish = false

[[bin]]
name = "naked-pineapple-email-automation"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
naked-pineapple-services = { workspace = true }

# Web framework (health check endpoint only)
axum = { workspace = true }
tokio = { workspace = true }

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client (Microsoft Graph API)
reqwest = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Error tracking
sentry = { workspace = true }
sentry-tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
dotenvy = { workspace = true }
chrono = { workspace = true }
time = "0.3"

# Security
secrecy = { workspace = true }

# Templates (outbound email rendering)
askama = { workspace = true }

# Utilities (Slack webhook URL encoding)
urlencoding = { workspace = true }
uuid = { workspace = true }
