[package]
name = "naked-pineapple-support"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared customer support library for Naked Pineapple (used by storefront and admin)"
publish = false

[features]
default = []
# cargo sqlx prepare can only validate macros against a single DATABASE_URL. Crates that
# connect to a different database (e.g. admin uses np_admin) must not enable this feature,
# otherwise their sqlx prepare step fails trying to validate storefront queries.
sqlx-macros = []

[lints]
workspace = true

[dependencies]
naked-pineapple-core = { workspace = true, features = ["postgres"] }
naked-pineapple-services = { workspace = true }

# Database
sqlx = { workspace = true, features = ["time"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Async
async-stream = "0.3"
futures = { workspace = true }

# Types
chrono = { workspace = true }
time = "0.3"

# Security
secrecy = { workspace = true }
